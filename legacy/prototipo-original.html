<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sazón — Recetario y costeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F3EA;
    --surface: #FFFFFF;
    --surface-soft: #F1ECDF;
    --ink: #23241F;
    --ink-soft: #6B6C61;
    --line: #E1DBC8;
    --brand: #2F4B3C;
    --brand-dark: #223629;
    --brand-tint: #DCE6DD;
    --gold: #C7962E;
    --gold-tint: #F3E6C4;
    --good: #3C6B41;
    --good-tint: #DEEBDD;
    --bad: #A93A2E;
    --bad-tint: #F3DEDA;
    --radius: 3px;
    --shadow: 0 1px 2px rgba(35,36,31,0.06);
  }
  :root:not([data-theme="light"]){ }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]){
      --bg:#1B1C18; --surface:#242620; --surface-soft:#2C2E27; --ink:#EFEDE4; --ink-soft:#A9AA9D;
      --line:#3A3C33; --brand:#7FA98A; --brand-dark:#5E8A6C; --brand-tint:#26332A; --gold:#D9AE55;
      --gold-tint:#332B18; --good:#8BC08F; --good-tint:#20302280; --bad:#E08579; --bad-tint:#3A241F;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1C18; --surface:#242620; --surface-soft:#2C2E27; --ink:#EFEDE4; --ink-soft:#A9AA9D;
    --line:#3A3C33; --brand:#7FA98A; --brand-dark:#5E8A6C; --brand-tint:#26332A; --gold:#D9AE55;
    --gold-tint:#332B18; --good:#8BC08F; --good-tint:#20302280; --bad:#E08579; --bad-tint:#3A241F;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family:'IBM Plex Sans', Arial, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .num{ font-variant-numeric: tabular-nums; font-feature-settings:"tnum" 1; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface); }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:9px 16px; border-radius:var(--radius); border:1px solid transparent;
    font-size:14px; font-weight:600; transition:transform .08s ease, background .15s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--brand); color:#fff; }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-ghost{ background:transparent; color:var(--brand); border-color:var(--line); }
  .btn-ghost:hover{ background:var(--surface-soft); }
  .btn-danger{ background:transparent; color:var(--bad); border-color:var(--line); }
  .btn-danger:hover{ background:var(--bad-tint); }
  .btn-sm{ padding:5px 10px; font-size:12.5px; }
  .btn-block{ width:100%; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }
  .icon-btn{ background:transparent; border:none; color:var(--ink-soft); padding:4px 6px; border-radius:var(--radius); }
  .icon-btn:hover{ background:var(--surface-soft); color:var(--ink); }

  /* ---------- Inputs ---------- */
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; }
  .field{ margin-bottom:14px; }
  .field input[type=text], .field input[type=number], .field input[type=password],
  .field input[type=email], .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--surface); color:var(--ink);
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand);
  }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .row{ display:flex; gap:12px; }
  .row > .field{ flex:1; min-width:0; }
  .field-check{ display:flex; align-items:center; gap:8px; padding:8px 0; }
  .field-check input{ width:16px; height:16px; }
  .field-check label{ margin:0; font-weight:500; color:var(--ink); }

  /* ---------- Layout ---------- */
  #app{ min-height:100vh; }
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:216px; flex:none; background:var(--brand-dark); color:#EFEFE6;
    display:flex; flex-direction:column; padding:20px 14px;
  }
  .brand{ display:flex; align-items:center; gap:9px; padding:4px 6px 22px 6px; }
  .brand svg{ flex:none; }
  .brand-name{ font-family:'Fraunces',serif; font-size:21px; font-weight:700; color:#fff; }
  .brand-sub{ font-size:10.5px; color:#B9C7BC; margin-top:1px; }
  .nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius);
    color:#D8DFD5; font-size:13.5px; font-weight:500; background:transparent; border:none; text-align:left;
  }
  .nav-item svg{ flex:none; opacity:.85; }
  .nav-item:hover{ background:rgba(255,255,255,0.07); color:#fff; }
  .nav-item.active{ background:rgba(255,255,255,0.14); color:#fff; }
  .sidebar-foot{ border-top:1px solid rgba(255,255,255,0.12); padding-top:12px; margin-top:12px; }
  .user-chip{ font-size:12.5px; color:#C6D1C9; padding:4px 10px 10px; }
  .user-chip b{ color:#fff; display:block; font-size:13.5px; }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:none; align-items:center; justify-content:space-between; padding:12px 16px;
    background:var(--brand-dark); color:#fff;
  }
  .content{ flex:1; padding:30px 40px 60px; max-width:1080px; width:100%; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .page-head h1{ font-size:26px; }
  .page-sub{ color:var(--ink-soft); font-size:13.5px; margin-top:4px; }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:22px; }
  .panel + .panel{ margin-top:16px; }
  .section-title{ font-size:12.5px; font-weight:700; text-transform:none; color:var(--brand); letter-spacing:.01em; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line); }

  /* ---------- Login ---------- */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:400px; }
  .auth-logo{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:6px; }
  .auth-title{ text-align:center; font-size:30px; margin-bottom:4px; }
  .auth-tag{ text-align:center; color:var(--ink-soft); font-size:13.5px; margin-bottom:26px; }
  .tabs{ display:flex; border-bottom:1px solid var(--line); margin-bottom:20px; }
  .tab{ flex:1; text-align:center; padding:10px 0; font-size:13.5px; font-weight:600; color:var(--ink-soft); background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active{ color:var(--brand); border-color:var(--brand); }
  .auth-note{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:16px; line-height:1.5; }
  .error-msg{ background:var(--bad-tint); color:var(--bad); font-size:13px; padding:9px 12px; border-radius:var(--radius); margin-bottom:14px; }
  .btn-text{ background:none; border:none; padding:0; color:var(--brand); font-size:12.5px; font-weight:600; text-decoration:underline; }
  .btn-text:hover{ color:var(--brand-dark); }

  /* ---------- Onboarding ---------- */
  .onboard-card{ width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:28px 28px 24px; text-align:center; }
  .onboard-skip-row{ display:flex; justify-content:flex-end; min-height:18px; margin-bottom:6px; }
  .onboard-viewport{ overflow:hidden; }
  .onboard-track{ display:flex; transition:transform .38s cubic-bezier(.4,0,.2,1); }
  .onboard-slide{ flex:0 0 100%; width:100%; box-sizing:border-box; padding:0 2px; display:flex; flex-direction:column; align-items:center; }
  .onboard-illustration{ width:64px; height:64px; border-radius:50%; background:var(--brand-tint); color:var(--brand-dark); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; flex:none; }
  .onboard-illustration svg{ width:28px; height:28px; }
  .onboard-title{ font-size:21px; margin-bottom:10px; }
  .onboard-body{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; max-width:320px; margin:0 auto; min-height:76px; }
  .onboard-footer{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:20px; }
  .onboard-dots{ display:flex; justify-content:center; gap:6px; flex:1; }
  .onboard-dot{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:all .25s ease; }
  .onboard-dot.active{ background:var(--brand); width:16px; border-radius:4px; }
  .onboard-arrow{ width:40px; height:40px; border-radius:50%; background:var(--brand); color:#fff; border:none; display:flex; align-items:center; justify-content:center; flex:none; transition:background .15s ease, transform .08s ease, opacity .2s ease; }
  .onboard-arrow:hover{ background:var(--brand-dark); }
  .onboard-arrow:active{ transform:translateY(1px); }
  .onboard-arrow[disabled]{ opacity:0; pointer-events:none; }
  .onboard-arrow svg{ width:20px; height:20px; }
  .onboard-confirm-btn.hidden{ display:none; }
  @media (prefers-reduced-motion: reduce){
    .onboard-track{ transition:none; }
  }

  /* ---------- Inicio / dashboard ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:16px; }
  .stat-card{ cursor:pointer; text-align:center; padding:18px 14px; transition:border-color .15s ease; }
  .stat-card:hover{ border-color:var(--brand); }
  .stat-num{ font-family:'Fraunces',serif; font-size:30px; font-weight:700; color:var(--brand-dark); line-height:1; }
  .stat-label{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  /* ---------- Empty state ---------- */
  .empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty h3{ font-family:'Fraunces',serif; font-size:19px; color:var(--ink); margin-bottom:6px; }
  .empty p{ font-size:13.5px; max-width:340px; margin:0 auto 18px; }

  /* ---------- Recipe grid ---------- */
  .recipe-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:18px; }
  .recipe-card{ background:var(--surface); border:1px solid var(--line); cursor:pointer; overflow:hidden; }
  .recipe-photo{ width:100%; aspect-ratio:4/3; background:var(--surface-soft) center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .recipe-body{ padding:12px 14px 14px; }
  .recipe-cat{ font-size:11px; color:var(--gold); font-weight:700; margin-bottom:3px; }
  .recipe-name{ font-family:'Fraunces',serif; font-size:16.5px; font-weight:600; margin-bottom:6px; }
  .recipe-meta{ font-size:12px; color:var(--ink-soft); display:flex; gap:10px; border-top:1px solid var(--line); padding-top:8px; margin-top:2px;}

  /* ---------- Table ---------- */
  table.data{ width:100%; border-collapse:collapse; }
  table.data th{ text-align:left; font-size:11.5px; text-transform:none; color:var(--ink-soft); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); }
  table.data td{ padding:10px 10px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  table.data tr:last-child td{ border-bottom:none; }
  table.data td.num, table.data th.num{ text-align:right; }
  .row-actions{ display:flex; gap:4px; justify-content:flex-end; }

  /* ---------- Chips / badges ---------- */
  .badge{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .badge-good{ background:var(--good-tint); color:var(--good); }
  .badge-warn{ background:var(--gold-tint); color:#8A6A18; }
  .badge-bad{ background:var(--bad-tint); color:var(--bad); }

  /* ---------- Ingredient/step lines ---------- */
  .line-row{ display:flex; gap:8px; align-items:flex-end; padding:10px 0; border-bottom:1px solid var(--line); }
  .line-row:last-child{ border-bottom:none; }
  .line-row .field{ margin-bottom:0; }
  .step-row{ display:flex; gap:8px; align-items:flex-start; padding:8px 0; }
  .step-num{ width:22px; height:22px; border-radius:50%; background:var(--brand-tint); color:var(--brand); font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none; margin-top:4px; }

  /* ---------- Photo upload ---------- */
  .photo-drop{ border:1px dashed var(--line); border-radius:var(--radius); padding:16px; text-align:center; background:var(--surface-soft); }
  .photo-preview{ width:100%; max-width:220px; aspect-ratio:4/3; object-fit:cover; border-radius:var(--radius); display:block; margin:0 auto 10px; border:1px solid var(--line); }

  /* ---------- Quote result ---------- */
  .quote-result{ background:var(--brand-tint); border-radius:var(--radius); padding:20px 22px; }
  .quote-price{ font-family:'Fraunces',serif; font-size:38px; font-weight:700; color:var(--brand-dark); line-height:1; }
  .quote-price small{ font-size:15px; font-weight:500; color:var(--ink-soft); }
  .quote-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-top:16px; }
  .quote-stat-label{ font-size:11.5px; color:var(--ink-soft); margin-bottom:2px; }
  .quote-stat-val{ font-size:17px; font-weight:700; }

  /* ---------- Rentabilidad bar ---------- */
  .bar-track{ background:var(--surface-soft); border-radius:20px; height:8px; width:100%; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:20px; }

  /* ---------- Modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(20,20,16,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal{ background:var(--surface); border-radius:var(--radius); max-width:420px; width:100%; padding:24px; }
  .modal h3{ font-size:18px; margin-bottom:8px; }
  .modal p{ font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--brand-dark); color:#fff; padding:10px 18px; border-radius:var(--radius); font-size:13.5px; z-index:60; box-shadow:0 4px 14px rgba(0,0,0,.2); }

  .chan-list{ display:flex; flex-direction:column; gap:8px; }
  .chan-row{ display:flex; gap:8px; align-items:center; }
  .chan-row .field{ margin:0; flex:1; }
  .chan-row .field.small{ flex:0 0 100px; }

  .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  @media (max-width:760px){ .settings-grid{ grid-template-columns:1fr; } }

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .shell{ flex-direction:column; }
    .sidebar{ display:none; }
    .topbar{ display:flex; flex:none; width:100%; }
    .main{ width:100%; }
    .content{ padding:20px 16px 50px; }
    .drawer{ position:fixed; inset:0 20% 0 0; background:var(--brand-dark); z-index:40; padding:20px 14px; display:flex; flex-direction:column; }
    .drawer-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:39; }
    .row{ flex-direction:column; }
    .settings-grid{ grid-template-columns:1fr; }
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================================
   SAZÓN — prototipo funcional
   Recetario + costeo de producción + cotizador de precio de venta
   Todo el almacenamiento es local (localStorage del navegador). Es un
   prototipo para validar la lógica y la experiencia de uso: no es un
   login seguro real ni una base de datos compartida entre dispositivos.
   ========================================================================= */

/* ---------------------------- Constantes ---------------------------- */
const UNIT_TO_BASE = { kg:1000, g:1, l:1000, ml:1, unidad:1 };
const UNIT_FAMILY  = { kg:'peso', g:'peso', l:'volumen', ml:'volumen', unidad:'unidad' };
const FAMILY_UNITS = { peso:['kg','g'], volumen:['l','ml'], unidad:['unidad'] };
const UNIT_LABEL   = { kg:'kg', g:'g', l:'l', ml:'ml', unidad:'unidad' };

const CURRENCIES = [
  { code:'ARS', label:'Peso argentino', symbol:'$' },
  { code:'USD', label:'Dólar estadounidense', symbol:'US$' },
  { code:'EUR', label:'Euro', symbol:'€' },
  { code:'MXN', label:'Peso mexicano', symbol:'$' },
  { code:'CLP', label:'Peso chileno', symbol:'$' },
  { code:'COP', label:'Peso colombiano', symbol:'$' },
  { code:'UYU', label:'Peso uruguayo', symbol:'$U' },
  { code:'BRL', label:'Real brasileño', symbol:'R$' },
  { code:'PEN', label:'Sol peruano', symbol:'S/' },
  { code:'BOB', label:'Boliviano', symbol:'Bs' },
  { code:'OTRA', label:'Otra moneda', symbol:'' },
];

const CATEGORIAS = ['Panadería','Pastelería','Repostería','Viandas','Bebidas','Conservas','Snacks','Otro'];

/* ---------------------------- Almacenamiento ---------------------------- */
const DB_KEY = 'sazon_db_v1';
const SESSION_KEY = 'sazon_session_v1';

function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return { users:{} };
    const parsed = JSON.parse(raw);
    if(!parsed.users) return { users:{} };
    return parsed;
  }catch(e){ return { users:{} }; }
}
let storageAvailable = true;
function checkStorage(){
  try{
    const k = '__sazon_probe__';
    localStorage.setItem(k,'1'); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
function saveDB(){
  try{
    if(session && DB.users[session]){
      DB.users[session].meta = { ...(DB.users[session].meta||{}), lastSavedAt: Date.now() };
    }
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  }catch(e){ storageAvailable = false; }
}
function loadSession(){ try{ return localStorage.getItem(SESSION_KEY) || null; }catch(e){ return null; } }
function saveSession(u){ try{ if(u) localStorage.setItem(SESSION_KEY, u); else localStorage.removeItem(SESSION_KEY); }catch(e){ storageAvailable = false; } }

let DB = loadDB();
let session = loadSession();
storageAvailable = checkStorage();

/* ---------------------------- Utilidades ---------------------------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function clampNum(v, def){ const n = parseFloat(v); return isNaN(n) ? def : n; }

function currentUser(){ return session ? DB.users[session] : null; }
function currencySymbol(){
  const u = currentUser(); if(!u) return '$';
  if(u.config.monedaCode === 'OTRA') return u.config.monedaSimboloCustom || '$';
  const c = CURRENCIES.find(c=>c.code===u.config.monedaCode);
  return c ? c.symbol : '$';
}
function money(n){
  if(n===null || n===undefined || isNaN(n)) return currencySymbol()+' —';
  const formatted = Math.abs(n).toLocaleString('es-AR', { minimumFractionDigits:2, maximumFractionDigits:2 });
  return (n<0 ? '-' : '') + currencySymbol() + ' ' + formatted;
}
function pct(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return (n*100).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; }

function timeAgo(ts){
  if(!ts) return 'todavía no se guardó nada';
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff/60000);
  if(min < 1) return 'hace instantes';
  if(min < 60) return `hace ${min} minuto${min===1?'':'s'}`;
  const hrs = Math.floor(min/60);
  if(hrs < 24) return `hace ${hrs} hora${hrs===1?'':'s'}`;
  const days = Math.floor(hrs/24);
  return `hace ${days} día${days===1?'':'s'}`;
}

function defaultConfig(){
  return {
    monedaCode: 'ARS',
    monedaSimboloCustom: '',
    impuestoDefault: 0,
    margenDefault: 40,
    modoMargenDefault: 'costo',
    margenMinimo: 20,
    canales: [
      { id: uid(), nombre:'Venta directa / efectivo', comision:0 },
      { id: uid(), nombre:'Mercado Pago', comision:6 },
      { id: uid(), nombre:'App de delivery', comision:25 },
    ]
  };
}

function createUser(username, password){
  DB.users[username] = {
    password,
    config: defaultConfig(),
    ingredientes: [],
    recetas: [],
    costosIndirectos: [],
  };
  saveDB();
}

/* ---------------------------- Cálculo de costos ---------------------------- */
function ingredienteCostoBase(ing){
  const cant = ing.cantidadCompra * (UNIT_TO_BASE[ing.unidadCompra] || 1);
  if(!cant) return 0;
  return ing.precioCompra / cant;
}

function mapById(list){ const m={}; list.forEach(i=>m[i.id]=i); return m; }

function recetaCostoDirectoTotal(receta, ingMap){
  return (receta.ingredientes||[]).reduce((sum,line)=>{
    const ing = ingMap[line.ingredienteId];
    if(!ing) return sum;
    const costoBase = ingredienteCostoBase(ing);
    const cantidadEnBase = (line.cantidad||0) * (UNIT_TO_BASE[line.unidad]||1);
    return sum + cantidadEnBase * costoBase;
  },0);
}

function recetaCostoIndirectoPorUnidad(receta, ciMap){
  return (receta.indirectos||[]).reduce((sum,id)=>{
    const ci = ciMap[id];
    if(!ci) return sum;
    if(ci.modo === 'porLote') return sum + (ci.monto / (receta.rendimientoCantidad || 1));
    return sum + ci.monto;
  },0);
}

function recetaCostos(receta){
  const u = currentUser();
  const ingMap = mapById(u.ingredientes);
  const ciMap = mapById(u.costosIndirectos);
  const directoTotal = recetaCostoDirectoTotal(receta, ingMap);
  const directoPorUnidad = directoTotal / (receta.rendimientoCantidad || 1);
  const indirectoPorUnidad = recetaCostoIndirectoPorUnidad(receta, ciMap);
  return {
    directoTotal,
    directoPorUnidad,
    indirectoPorUnidad,
    costoPorUnidad: directoPorUnidad + indirectoPorUnidad
  };
}

function calcularCotizacion({ costoPorUnidad, margenPct, modoMargen, impuestoPct, comisionPct, precioManual }){
  const C = costoPorUnidad || 0;
  const m = (margenPct||0) / 100;
  const t = (impuestoPct||0) / 100;
  const c = (comisionPct||0) / 100;
  let precioFinal;
  if(precioManual !== null && precioManual !== undefined && !isNaN(precioManual)){
    precioFinal = precioManual;
  } else if(modoMargen === 'venta'){
    const denom = 1 - t - c - m;
    precioFinal = denom > 0 ? C / denom : NaN;
  } else {
    const denom = 1 - t - c;
    precioFinal = denom > 0 ? (C + C*m) / denom : NaN;
  }
  const netoRecibido = precioFinal * (1 - t - c);
  const gananciaNeta = netoRecibido - C;
  const margenSobreCosto = C > 0 ? gananciaNeta / C : 0;
  const margenSobreVenta = precioFinal > 0 ? gananciaNeta / precioFinal : 0;
  return { precioFinal, netoRecibido, gananciaNeta, margenSobreCosto, margenSobreVenta };
}

/* Avanza/retrocede el carrusel del instructivo animando en el DOM existente,
   en vez de reconstruir todo (así la transición CSS de deslizamiento se ve). */
function stepOnboard(delta){
  const max = ONBOARDING_SLIDES.length - 1;
  const next = Math.max(0, Math.min(max, onboardStep + delta));
  if(next === onboardStep) return;
  onboardStep = next;
  const scope = document.getElementById('app');
  const track = scope.querySelector('.onboard-track');
  if(!track){ render(); return; } // red de seguridad si no está montado
  track.style.transform = `translateX(-${onboardStep*100}%)`;
  scope.querySelectorAll('.onboard-dot').forEach((d,i)=>d.classList.toggle('active', i===onboardStep));
  const isFirst = onboardStep===0, isLast = onboardStep===max;
  scope.querySelectorAll('.onboard-back-arrow').forEach(b=>{ b.disabled = isFirst; });
  scope.querySelectorAll('.onboard-next-arrow').forEach(b=> b.classList.toggle('hidden', isLast));
  scope.querySelectorAll('.onboard-confirm-btn').forEach(b=> b.classList.toggle('hidden', !isLast));
  scope.querySelectorAll('.onboard-skip-link').forEach(b=> b.classList.toggle('hidden', isLast));
}
function showToast(msg){
  toastMsg = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastMsg=null; render(); }, 2600);
}

      </div>`).join('');

  const costos = recetaCostos(d);

  return `
  <div class="page-head">
    <div><h1>${isEdit ? 'Editar receta' : 'Nueva receta'}</h1><div class="page-sub">Cargá los datos y el costo se calcula automáticamente.</div></div>
    <div style="display:flex;gap:8px">

        <label>Nombre de la receta</label>
        <input type="text" data-bind="nombre" value="${esc(d.nombre)}" placeholder="ej. Alfajores de maicena">
      </div>
      <div class="field">
        <label>Categoría</label>
        <select data-bind="categoria">
          <option value="">Elegir…</option>
          ${CATEGORIAS.map(c=>`<option value="${c}" ${d.categoria===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>${icon('clock')} Tiempo de preparación</label>
        <input type="text" data-bind="tiempoPrep" value="${esc(d.tiempoPrep)}" placeholder="ej. 1 h 30 min">
      </div>
      <div class="field">
        <label>${icon('yield')} Rendimiento (cuánto da la receta)</label>
        <div class="row" style="gap:6px">
          <input type="number" min="0" step="any" data-bind="rendimientoCantidad" value="${d.rendimientoCantidad}" style="flex:1">

      </div>

    <div class="field">
      <label>Foto del producto</label>
      <div class="photo-drop">
        ${d.fotoDataUrl ? `<img class="photo-preview" src="${d.fotoDataUrl}">` : ''}

    ${stepRows}

  </div>

  <div class="panel">
    <div class="section-title">Notas</div>
    <div class="field" style="margin:0">
      <textarea data-bind="notas" placeholder="Tips, variantes, proveedores preferidos…">${esc(d.notas)}</textarea>
    </div>
  </div>

  <div class="panel" style="background:var(--brand-tint);border-color:transparent">
    <div class="section-title" style="border-color:rgba(0,0,0,0.08)">Costo de producción estimado</div>
    <div class="row">
      <div><div class="hint">Costo directo por ${esc(d.rendimientoUnidad||'unidad')}</div><div class="num" style="font-weight:700;font-size:16px">${money(costos.directoPorUnidad)}</div></div>
      <div><div class="hint">Costo indirecto por ${esc(d.rendimientoUnidad||'unidad')}</div><div class="num" style="font-weight:700;font-size:16px">${money(costos.indirectoPorUnidad)}</div></div>
      <div><div class="hint">Costo total por ${esc(d.rendimientoUnidad||'unidad')}</div><div class="num" style="font-weight:700;font-size:16px;color:var(--brand-dark)">${money(costos.costoPorUnidad)}</div></div>
    </div>
  </div>
  `;
}

/* ---------------------------- COTIZADOR ---------------------------- */
let cotizadorState = { recetaId:null, margen:null, modoMargen:null, canalId:null, impuesto:null, precioManual:'' };

function renderCotizador(u){
  if(u.recetas.length===0){
    return `<div class="page-head"><div><h1>Cotizador</h1></div></div>
    <div class="panel empty"><h3>Necesitás al menos una receta</h3><p>Cargá una receta en el recetario para poder cotizarla.</p>
    <button class="btn btn-primary" data-action="new-receta">${icon('plus')} Cargar receta</button></div>`;
  }
  if(!cotizadorState.recetaId) cotizadorState.recetaId = u.recetas[0].id;
  const receta = u.recetas.find(r=>r.id===cotizadorState.recetaId) || u.recetas[0];
  const costos = recetaCostos(receta);

  const margen = cotizadorState.margen ?? u.config.margenDefault;
  const modoMargen = cotizadorState.modoMargen ?? u.config.modoMargenDefault;
  const impuesto = cotizadorState.impuesto ?? u.config.impuestoDefault;
  const canalId = cotizadorState.canalId ?? (u.config.canales[0] && u.config.canales[0].id);
  const canal = u.config.canales.find(c=>c.id===canalId) || {comision:0};
  const precioManual = cotizadorState.precioManual !== '' ? parseFloat(cotizadorState.precioManual) : null;

  const result = calcularCotizacion({
    costoPorUnidad: costos.costoPorUnidad,
    margenPct: margen, modoMargen, impuestoPct: impuesto, comisionPct: canal.comision,
    precioManual
  });

  const margenMin = u.config.margenMinimo/100;
  const badge = result.margenSobreVenta >= margenMin ? 'badge-good' : (result.margenSobreVenta >= margenMin-0.05 ? 'badge-warn' : 'badge-bad');
  const badgeText = result.margenSobreVenta >= margenMin ? 'Margen saludable' : (result.margenSobreVenta >= margenMin-0.05 ? 'Margen justo' : 'Margen bajo');

  return `
  <div class="page-head"><div><h1>Cotizador</h1><div class="page-sub">Elegí una receta y definí cuánto querés ganar.</div></div></div>

  <div class="panel">
    <div class="row">
      <div class="field">
        <label>Receta</label>
        <select data-bind="cotiz-receta">
          ${u.recetas.map(r=>`<option value="${r.id}" ${r.id===receta.id?'selected':''}>${esc(r.nombre)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Canal de venta</label>
        <select data-bind="cotiz-canal">
          ${u.config.canales.map(c=>`<option value="${c.id}" ${c.id===canalId?'selected':''}>${esc(c.nombre)} (${c.comision}% com.)</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Margen de ganancia deseado (%)</label>
        <input type="number" min="0" max="95" step="any" data-bind="cotiz-margen" value="${margen}">
      </div>
      <div class="field">
        <label>El margen se calcula sobre…</label>
        <select data-bind="cotiz-modo">
          <option value="costo" ${modoMargen==='costo'?'selected':''}>El costo (margen sobre costo)</option>
          <option value="venta" ${modoMargen==='venta'?'selected':''}>El precio de venta (margen sobre venta)</option>
        </select>
      </div>
      <div class="field">
        <label>Impuesto aplicable (%)</label>
        <input type="number" min="0" max="95" step="any" data-bind="cotiz-impuesto" value="${impuesto}">
      </div>
    </div>
    <div class="field" style="max-width:260px">
      <label>Forzar un precio manual (opcional)</label>
      <input type="number" min="0" step="any" data-bind="cotiz-manual" value="${cotizadorState.precioManual}" placeholder="dejalo vacío para usar el sugerido">
    </div>
  </div>

  <div class="panel quote-result">
    <div class="hint" style="margin-bottom:2px">Precio de venta ${precioManual!==null ? '(forzado)' : 'sugerido'} para ${esc(receta.nombre)}</div>
    <div class="quote-price num">${money(result.precioFinal)} <small>/ ${esc(receta.rendimientoUnidad||'unidad')}</small></div>
    <div style="margin-top:8px"><span class="badge ${badge}">${badgeText}</span></div>
    <div class="quote-grid">
      <div><div class="quote-stat-label">Costo de producción</div><div class="quote-stat-val num">${money(costos.costoPorUnidad)}</div></div>
      <div><div class="quote-stat-label">Neto tras impuesto y comisión</div><div class="quote-stat-val num">${money(result.netoRecibido)}</div></div>
      <div><div class="quote-stat-label">Ganancia neta por unidad</div><div class="quote-stat-val num">${money(result.gananciaNeta)}</div></div>
      <div><div class="quote-stat-label">Margen sobre el costo</div><div class="quote-stat-val num">${pct(result.margenSobreCosto)}</div></div>
      <div><div class="quote-stat-label">Margen sobre el precio de venta</div><div class="quote-stat-val num">${pct(result.margenSobreVenta)}</div></div>
    </div>
  </div>
  <div class="hint" style="margin-top:10px">Ganancia total estimada del lote (${receta.rendimientoCantidad} ${esc(receta.rendimientoUnidad||'u')}): <b class="num">${money(result.gananciaNeta*receta.rendimientoCantidad)}</b></div>
  `;
}

/* ---------------------------- RENTABILIDAD ---------------------------- */
function renderRentabilidad(u){
  if(u.recetas.length===0){
    return `<div class="page-head"><div><h1>Rentabilidad</h1></div></div>
    <div class="panel empty"><h3>Todavía no hay recetas para comparar</h3><p>Cargá recetas para ver cuáles te dejan mejor margen.</p></div>`;
  }
  const margenMin = u.config.margenMinimo/100;
  const rows = u.recetas.map(r=>{
    const costos = recetaCostos(r);
    const result = calcularCotizacion({
      costoPorUnidad: costos.costoPorUnidad,
      margenPct: r.margenPersonalizado ?? u.config.margenDefault,
      modoMargen: r.modoMargenPersonalizado || u.config.modoMargenDefault,
      impuestoPct: u.config.impuestoDefault,
      comisionPct: (u.config.canales[0] && u.config.canales[0].comision) || 0,
      precioManual: null
    });
    return { r, costos, result };
  }).sort((a,b)=>b.result.margenSobreVenta - a.result.margenSobreVenta);

  const trs = rows.map(({r,costos,result})=>{
    const barPct = Math.max(0, Math.min(100, result.margenSobreVenta*100));
    const color = result.margenSobreVenta >= margenMin ? 'var(--good)' : (result.margenSobreVenta >= margenMin-0.05 ? 'var(--gold)' : 'var(--bad)');
    return `
    <tr>
      <td>${esc(r.nombre)}</td>
      <td class="num">${money(costos.costoPorUnidad)}</td>
      <td class="num">${money(result.precioFinal)}</td>
      <td class="num">${money(result.gananciaNeta)}</td>
      <td style="min-width:140px">
        <div class="bar-track"><div class="bar-fill" style="width:${barPct}%;background:${color}"></div></div>
        <div class="hint num" style="margin-top:3px">${pct(result.margenSobreVenta)}</div>
      </td>
      <td><button class="btn btn-ghost btn-sm" data-action="quote-from-rank" data-id="${r.id}">Cotizar</button></td>
    </tr>`;
  }).join('');

  return `
  <div class="page-head"><div><h1>Rentabilidad</h1><div class="page-sub">Comparación entre todas tus recetas, con el margen y canal por defecto.</div></div></div>
  <div class="panel" style="padding:0">
    <table class="data">
      <thead><tr><th>Receta</th><th class="num">Costo</th><th class="num">Precio sugerido</th><th class="num">Ganancia / u.</th><th>Margen sobre venta</th><th></th></tr></thead>
      <tbody>${trs}</tbody>
    </table>
  </div>
  <div class="hint" style="margin-top:10px">El umbral de "margen saludable" se define en Configuración (actualmente ${u.config.margenMinimo}%).</div>
  `;
}

/* ---------------------------- CONFIGURACIÓN ---------------------------- */
function renderConfig(u){
  const c = u.config;
  const chanRows = c.canales.map((ch,idx)=>`
    <div class="chan-row">
      <div class="field"><input type="text" data-bind="chan-nombre" data-idx="${idx}" value="${esc(ch.nombre)}"></div>
      <div class="field small"><input type="number" min="0" max="95" step="any" data-bind="chan-comision" data-idx="${idx}" value="${ch.comision}"></div>
      <button type="button" class="icon-btn" data-action="remove-canal" data-idx="${idx}">${icon('trash')}</button>
    </div>`).join('');

  return `
  <div class="page-head"><div><h1>Configuración</h1><div class="page-sub">Valores por defecto para tus cotizaciones.</div></div></div>

  <div class="settings-grid">
    <div class="panel">
      <div class="section-title">Moneda</div>
      <div class="field">
        <label>Moneda de tus cotizaciones</label>
        <select data-bind="cfg-moneda">
          ${CURRENCIES.map(cur=>`<option value="${cur.code}" ${c.monedaCode===cur.code?'selected':''}>${cur.label}${cur.symbol?` (${cur.symbol})`:''}</option>`).join('')}
        </select>
      </div>
      ${c.monedaCode==='OTRA' ? `<div class="field"><label>Símbolo personalizado</label><input type="text" data-bind="cfg-moneda-custom" value="${esc(c.monedaSimboloCustom)}" placeholder="ej. Gs."></div>` : ''}
    </div>

    <div class="panel">
      <div class="section-title">Valores por defecto del cotizador</div>
      <div class="row">
        <div class="field"><label>Margen deseado (%)</label><input type="number" min="0" max="95" step="any" data-bind="cfg-margen" value="${c.margenDefault}"></div>
        <div class="field"><label>Impuesto (%)</label><input type="number" min="0" max="95" step="any" data-bind="cfg-impuesto" value="${c.impuestoDefault}"></div>
      </div>
      <div class="field">
        <label>El margen por defecto se calcula sobre…</label>
        <select data-bind="cfg-modo-margen">
          <option value="costo" ${c.modoMargenDefault==='costo'?'selected':''}>El costo</option>
          <option value="venta" ${c.modoMargenDefault==='venta'?'selected':''}>El precio de venta</option>
        </select>
      </div>
      <div class="field">
        <label>Margen mínimo aceptable (%) — para las alertas del panel de rentabilidad</label>
        <input type="number" min="0" max="95" step="any" data-bind="cfg-margen-min" value="${c.margenMinimo}">
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="section-title">Canales de venta y sus comisiones</div>
    <div class="chan-list">${chanRows}</div>
    <button type="button" class="btn btn-ghost btn-sm" style="margin-top:10px" data-action="add-canal">${icon('plus')} Agregar canal</button>
  </div>

  <div class="panel">
    <div class="section-title">Ayuda</div>
    <button class="btn btn-ghost btn-sm" data-action="open-tour">Ver el instructivo de nuevo</button>
  </div>

  <div style="margin-top:18px"><button class="btn btn-primary" data-action="save-config">Guardar configuración</button></div>
  `;
}

/* ============================= EVENTOS ============================= */
function wireEvents(){
  const appEl = document.getElementById('app');

  // Submit del formulario de login/registro
  const authForm = appEl.querySelector('form[data-form="auth"]');
  if(authForm){
    authForm.addEventListener('submit', e=>{
      e.preventDefault();
      const fd = new FormData(authForm);
      const username = (fd.get('username')||'').toString().trim();
      const password = (fd.get('password')||'').toString();
      if(!username || !password){ authError='Completá usuario y contraseña.'; render(); return; }
      if(authMode==='registro'){
        const password2 = (fd.get('password2')||'').toString();
        if(password !== password2){ authError='Las contraseñas no coinciden.'; render(); return; }
        if(DB.users[username]){ authError='Ese usuario ya existe. Iniciá sesión.'; render(); return; }
        createUser(username, password);
        session = username; saveSession(session);
        authError=''; goto('inicio');
      } else {
        const u = DB.users[username];
        if(!u || u.password !== password){ authError='Usuario o contraseña incorrectos.'; render(); return; }
        session = username; saveSession(session);
        authError=''; goto('inicio');
      }
    });
  }

  // Inputs que actualizan el draft sin re-render (para no perder el foco)
  appEl.querySelectorAll('[data-bind]').forEach(el=>{
    const bind = el.dataset.bind;
    const evt = (el.tagName==='SELECT' || el.type==='checkbox' || el.type==='file') ? 'change' : 'input';
    el.addEventListener(evt, e=>bindHandler(bind, el, e));
  });

  appEl.addEventListener('click', onClick);
}

function bindHandler(bind, el, e){
  const idx = el.dataset.idx !== undefined ? parseInt(el.dataset.idx) : null;
  switch(bind){
    case 'nombre': draft.nombre = el.value; break;
    case 'categoria': draft.categoria = el.value; break;
    case 'tiempoPrep': draft.tiempoPrep = el.value; break;
    case 'rendimientoCantidad': draft.rendimientoCantidad = clampNum(el.value,1); render(); return;
    case 'rendimientoUnidad': draft.rendimientoUnidad = el.value; render(); return;
    case 'notas': draft.notas = el.value; break;
    case 'foto': handlePhoto(el.files[0]); return;
    case 'ing-select': draft.ingredientes[idx].ingredienteId = el.value; draft.ingredientes[idx].unidad = defaultUnitFor(el.value); render(); return;
    case 'ing-cant': draft.ingredientes[idx].cantidad = clampNum(el.value,0); render(); return;
    case 'ing-unidad': draft.ingredientes[idx].unidad = el.value; render(); return;
    case 'ci-check': {
      const id = el.dataset.id;
      draft.indirectos = draft.indirectos || [];
      if(el.checked){ if(!draft.indirectos.includes(id)) draft.indirectos.push(id); }
      else { draft.indirectos = draft.indirectos.filter(x=>x!==id); }
      render(); return;
    }
    case 'paso': draft.pasos[idx] = el.value; break;
    case 'unidadCompra': draft.unidadCompra = el.value; render(); return;
    case 'cantidadCompra': draft.cantidadCompra = clampNum(el.value,0); render(); return;
    case 'precioCompra': draft.precioCompra = clampNum(el.value,0); render(); return;
    case 'monto': draft.monto = clampNum(el.value,0); render(); return;
    case 'modo': draft.modo = el.value; break;
    case 'cotiz-receta': cotizadorState.recetaId = el.value; render(); return;
    case 'cotiz-canal': cotizadorState.canalId = el.value; render(); return;
    case 'cotiz-margen': cotizadorState.margen = clampNum(el.value,0); render(); return;
    case 'cotiz-modo': cotizadorState.modoMargen = el.value; render(); return;
    case 'cotiz-impuesto': cotizadorState.impuesto = clampNum(el.value,0); render(); return;
    case 'cotiz-manual': cotizadorState.precioManual = el.value; render(); return;
    case 'cfg-moneda': currentUser().config.monedaCode = el.value; render(); return;
    case 'cfg-moneda-custom': currentUser().config.monedaSimboloCustom = el.value; break;
    case 'cfg-margen': currentUser().config.margenDefault = clampNum(el.value,0); break;
    case 'cfg-impuesto': currentUser().config.impuestoDefault = clampNum(el.value,0); break;
    case 'cfg-modo-margen': currentUser().config.modoMargenDefault = el.value; break;
    case 'cfg-margen-min': currentUser().config.margenMinimo = clampNum(el.value,0); break;
    case 'chan-nombre': currentUser().config.canales[idx].nombre = el.value; break;
    case 'chan-comision': currentUser().config.canales[idx].comision = clampNum(el.value,0); break;
  }
}

function defaultUnitFor(ingredienteId){
  const u = currentUser();
  const ing = u.ingredientes.find(i=>i.id===ingredienteId);
  if(!ing) return 'unidad';
  const family = UNIT_FAMILY[ing.unidadCompra] || 'unidad';
  const opts = FAMILY_UNITS[family];
  return opts[opts.length-1]; // la unidad más chica de la familia (g, ml o unidad)
}

function handlePhoto(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 640;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale; canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      draft.fotoDataUrl = canvas.toDataURL('image/jpeg', 0.72);
      render();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function onClick(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;
  const u = currentUser();

  switch(action){
    case 'auth-tab': authMode = t.dataset.mode; authError=''; render(); break;
    case 'nav': goto(t.dataset.view); break;
    case 'toggle-drawer': drawerOpen = !drawerOpen; render(); break;
    case 'logout': session=null; saveSession(null); authMode='login'; authError=''; authScreen='auth'; goto('login'); break;

    case 'onboard-next': stepOnboard(1); break;
    case 'onboard-back': stepOnboard(-1); break;
    case 'onboard-skip': authScreen='auth'; onboardStep=0; render(); break;
    case 'onboard-finish': authScreen='auth'; authMode='registro'; onboardStep=0; render(); break;
    case 'show-onboarding': authScreen='onboarding'; onboardStep=0; render(); break;
    case 'open-tour': tourModalOpen=true; onboardStep=0; render(); break;
    case 'close-tour': tourModalOpen=false; render(); break;
    case 'tour-next': stepOnboard(1); break;
    case 'tour-back': stepOnboard(-1); break;

    case 'new-receta': draft = blankReceta(); goto('recetario'); break;
    case 'open-receta': {
      const r = u.recetas.find(r=>r.id===t.dataset.id);
      draft = JSON.parse(JSON.stringify(r)); draft.type='receta';
      if(!draft.pasos || draft.pasos.length===0) draft.pasos=[''];
      render(); break;
    }
    case 'cancel-form': draft=null; render(); break;
    case 'add-ing-line': draft.ingredientes.push({ ingredienteId:'', cantidad:0, unidad:'g' }); render(); break;
    case 'remove-ing-line': draft.ingredientes.splice(parseInt(t.dataset.idx),1); render(); break;
    case 'add-paso': draft.pasos.push(''); render(); break;
    case 'remove-paso': draft.pasos.splice(parseInt(t.dataset.idx),1); if(draft.pasos.length===0) draft.pasos=['']; render(); break;
    case 'pick-photo': document.getElementById('foto-input').click(); break;
    case 'save-receta': {
      if(!draft.nombre.trim()){ showToast('Ponele un nombre a la receta.'); return; }
      draft.ingredientes = draft.ingredientes.filter(l=>l.ingredienteId);
      draft.pasos = draft.pasos.filter(p=>p.trim());
      if(draft.pasos.length===0) draft.pasos=[];
      if(draft.id){
        const idx = u.recetas.findIndex(r=>r.id===draft.id);
        u.recetas[idx] = { ...draft };
      } else {
        draft.id = uid();
        u.recetas.push({ ...draft });
      }
      saveDB(); draft=null; showToast('Receta guardada.'); goto('recetario'); break;
    }
    case 'delete-receta': draft.confirmDelete = { kind:'receta', id:t.dataset.id, title:'Eliminar receta', body:'Esta acción no se puede deshacer.' }; render(); break;

    case 'new-ingrediente': draft = blankIngrediente(); render(); break;
    case 'edit-ingrediente': draft = { ...u.ingredientes.find(i=>i.id===t.dataset.id), type:'ingrediente' }; render(); break;
    case 'save-ingrediente': {
      if(!draft.nombre.trim()){ showToast('Ponele un nombre al ingrediente.'); return; }
      if(draft.id){
        const idx = u.ingredientes.findIndex(i=>i.id===draft.id);
        u.ingredientes[idx] = { ...draft };
      } else {
        draft.id = uid(); u.ingredientes.push({ ...draft });
      }
      saveDB(); draft=null; showToast('Ingrediente guardado.'); goto('ingredientes'); break;
    }
    case 'ask-delete-ingrediente': draft = { confirmDelete:{ kind:'ingrediente', id:t.dataset.id, title:'Eliminar ingrediente', body:'Las recetas que lo usan quedarán con esa línea sin costo. Esta acción no se puede deshacer.' } }; render(); break;

    case 'new-costo': draft = blankCosto(); render(); break;
    case 'edit-costo': draft = { ...u.costosIndirectos.find(c=>c.id===t.dataset.id), type:'costo' }; render(); break;
    case 'save-costo': {
      if(!draft.nombre.trim()){ showToast('Ponele un nombre al costo.'); return; }
      if(draft.id){
        const idx = u.costosIndirectos.findIndex(c=>c.id===draft.id);
        u.costosIndirectos[idx] = { ...draft };
      } else {
        draft.id = uid(); u.costosIndirectos.push({ ...draft });
      }
      saveDB(); draft=null; showToast('Costo indirecto guardado.'); goto('costos'); break;
    }
    case 'ask-delete-costo': draft = { confirmDelete:{ kind:'costo', id:t.dataset.id, title:'Eliminar costo indirecto', body:'Se va a quitar de las recetas que lo tengan asignado. Esta acción no se puede deshacer.' } }; render(); break;

    case 'cancel-delete': draft = draft && draft.type ? { ...draft, confirmDelete:null } : null; render(); break;
    case 'confirm-delete': {
      const info = draft.confirmDelete;
      if(info.kind==='receta'){ u.recetas = u.recetas.filter(r=>r.id!==info.id); saveDB(); draft=null; showToast('Receta eliminada.'); goto('recetario'); }
      if(info.kind==='ingrediente'){ u.ingredientes = u.ingredientes.filter(i=>i.id!==info.id); saveDB(); draft=null; showToast('Ingrediente eliminado.'); goto('ingredientes'); }
      if(info.kind==='costo'){ u.costosIndirectos = u.costosIndirectos.filter(c=>c.id!==info.id); saveDB(); draft=null; showToast('Costo eliminado.'); goto('costos'); }
      break;
    }

    case 'quote-from-rank': cotizadorState.recetaId = t.dataset.id; goto('cotizador'); break;

    case 'add-canal': u.config.canales.push({ id:uid(), nombre:'Nuevo canal', comision:0 }); render(); break;
    case 'remove-canal': u.config.canales.splice(parseInt(t.dataset.idx),1); render(); break;
    case 'save-config': saveDB(); showToast('Configuración guardada.'); break;
  }
}

/* ---------------------------- Init ---------------------------- */
render();
</script>
</body>
